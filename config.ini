[network]
; ping先ホスト（IPアドレスまたはドメイン名）
host = 8.8.8.8
; 疎通確認に使用するNIC名（例: eth0）。空欄の場合はOSのルーティングに従う
interface =
; 1回の疎通確認で送信するping数
ping_count = 3
; ping応答待ちタイムアウト（秒）
ping_timeout = 2
; 疎通確認の実行間隔（秒）
check_interval = 60

[gpio]
; 疎通OK時に点灯させるLEDのBCM GPIO番号
led_green_pin = 17
; 疎通NG時に点灯させるLEDのBCM GPIO番号
led_red_pin = 27

[logging]
; ログファイルの出力先（logrotateの対象パスと一致させること）
log_file = /var/log/raspberry-watchdog/watchdog.log
; ログレベル（DEBUG, INFO, WARNING, ERROR）
log_level = INFO
